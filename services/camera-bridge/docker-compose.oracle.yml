services:
  camera-bridge:
    build:
      context: ../..
      dockerfile: services/camera-bridge/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8787
      CAMERA_BRIDGE_TOKEN: ${CAMERA_BRIDGE_TOKEN:?set CAMERA_BRIDGE_TOKEN}
      CAMERA_TEST_TIMEOUT_MS: 20000
      RUST_LOG: info
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - camera-bridge
    environment:
      BRIDGE_HOSTNAME: ${BRIDGE_HOSTNAME:?set BRIDGE_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
