name: Catalog Supplier Schema Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/catalog-schema-diff.yml"

permissions:
  contents: write

jobs:
  migration-diff:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      MIGRATION_DIR: prisma/migrations/20260822101500_catalog_supplier_schema_v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Apply existing migration history
        run: bash scripts/ci-migrate-with-external-fixtures.sh
      - name: Normalize SQL-managed objects
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-normalize-prisma-drift.sql
      - name: Generate exact Prisma migration diff
        run: |
          mkdir -p "$MIGRATION_DIR"
          npx prisma migrate diff --from-config-datasource --to-schema prisma --script > "$MIGRATION_DIR/migration.sql"
          test -s "$MIGRATION_DIR/migration.sql"
      - name: Validate migration on clean PostgreSQL
        run: |
          npx prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-normalize-prisma-drift.sql
          npx prisma migrate diff --from-config-datasource --to-schema prisma --exit-code
      - name: Commit exact migration and remove temporary workflow
        run: |
          rm .github/workflows/catalog-schema-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_DIR/migration.sql" .github/workflows/catalog-schema-diff.yml
          git commit -m "feat(data): add catalog supplier schema migration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
