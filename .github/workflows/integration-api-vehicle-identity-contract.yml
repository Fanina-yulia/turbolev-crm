name: Integration API Vehicle Identity Contract

on:
  pull_request:
    paths:
      - "src/lib/contracts/integration/v1/**"
      - "scripts/integration-api-vehicle-identity-contract-smoke.ts"
      - ".github/workflows/integration-api-vehicle-identity-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/contracts/integration/v1/**"
      - "scripts/integration-api-vehicle-identity-contract-smoke.ts"
      - ".github/workflows/integration-api-vehicle-identity-contract.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx --no-install tsx scripts/integration-api-vehicle-identity-contract-smoke.ts
