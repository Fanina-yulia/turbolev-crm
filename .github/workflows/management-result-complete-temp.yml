name: Temporary complete management result validation

on:
  push:
    branches:
      - feature/management-result-complete-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, '[management-result-complete]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integrate management result into cabinets and security
        run: python scripts/management-result-complete-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Management result contract smoke
        run: node --import tsx scripts/management-result-contract-smoke.ts
      - name: Management intelligence contract smoke
        run: node --import tsx scripts/management-intelligence-contract-smoke.ts
      - name: Role cabinet contract smoke
        run: node --import tsx scripts/role-cabinet-contract-smoke.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        env:
          VERCEL_ENV: preview
        run: npm run build
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "Turbo LEV Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/management-result-complete-temp.yml scripts/management-result-complete-patch.py
          git add app/owner-dashboard.tsx app/role-cabinet.tsx app/management-result-panel.tsx src/security/api-policy.ts package.json src/services/management-intelligence.service.ts docs/TZ_MANAGEMENT_RESULT_CABINETS_V1.md
          git commit -m "feat(management): complete result control system"
          git push origin HEAD:feature/management-result-complete-v1
