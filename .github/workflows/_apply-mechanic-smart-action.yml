name: Apply mechanic smart action integration

on:
  push:
    branches: [fix/mechanic-smart-action-scan]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mechanic-smart-action-scan
          fetch-depth: 0
      - name: Patch mechanic standalone cabinet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/mechanic-standalone-cabinet.tsx')
          text = path.read_text()

          def replace(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace(
              'import styles from "./mechanic-standalone-cabinet.module.css";',
              'import styles from "./mechanic-standalone-cabinet.module.css";\nimport { MechanicDiagnosticWorkspace } from "./mechanic-diagnostic-workspace";',
              'diagnostic workspace import',
          )

          replace(
              'type Screen = "HOME" | "WORKS" | "WORK_DETAIL" | "FINDING" | "DIAGNOSTICS" | "NOTIFICATIONS" | "PROFILE" | "SCHEDULE" | "PAYROLL" | "SUPPORT";',
              'type Screen = "HOME" | "WORKS" | "WORK_DETAIL" | "FINDING" | "DIAGNOSTICS" | "DIAGNOSTIC_DETAIL" | "NOTIFICATIONS" | "PROFILE" | "SCHEDULE" | "PAYROLL" | "SUPPORT";',
              'screen union',
          )

          replace(
              'function BottomNav({ screen, notificationCount, onChange }: { screen: Screen; notificationCount: number; onChange: (screen: Screen) => void }) {\n  const workActive = ["WORKS", "WORK_DETAIL", "FINDING", "SUPPORT"].includes(screen);\n  const profileActive = ["PROFILE", "SCHEDULE", "PAYROLL"].includes(screen);',
              'function BottomNav({ screen, notificationCount, onChange }: { screen: Screen; notificationCount: number; onChange: (screen: Screen) => void }) {\n  const workActive = ["WORKS", "WORK_DETAIL", "FINDING", "SUPPORT"].includes(screen);\n  const diagnosticActive = ["DIAGNOSTICS", "DIAGNOSTIC_DETAIL"].includes(screen);\n  const profileActive = ["PROFILE", "SCHEDULE", "PAYROLL"].includes(screen);',
              'bottom nav diagnostic state',
          )
          replace(
              'className={screen === "DIAGNOSTICS" ? styles.navActive : ""} onClick={() => onChange("DIAGNOSTICS")}',
              'className={diagnosticActive ? styles.navActive : ""} onClick={() => onChange("DIAGNOSTICS")}',
              'bottom nav diagnostic button',
          )

          replace(
              '  const [selectedTaskId, setSelectedTaskId] = useState<string | null>(null);',
              '  const [selectedTaskId, setSelectedTaskId] = useState<string | null>(null);\n  const [selectedDiagnosticId, setSelectedDiagnosticId] = useState<string | null>(null);',
              'selected diagnostic state',
          )

          marker = 'function BottomNav({ screen, notificationCount, onChange }:'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('plate helper insertion point not found')
          helper = '''function normalizedPlate(value?: string | null) {\n  const chars: Record<string, string> = { А: "A", В: "B", Е: "E", І: "I", К: "K", М: "M", Н: "H", О: "O", Р: "P", С: "C", Т: "T", Х: "X", У: "Y" };\n  const source = (value || "").normalize("NFKC").toUpperCase().replace(/[^A-ZА-ЯІЇЄ0-9]/g, "");\n  return [...source].map((char) => chars[char] || char).join("");\n}\n\n'''
          text = text[:idx] + helper + text[idx:]

          replace(
              '  const nextScheduledAppointment = scheduledAppointments\n    .filter((item) => new Date(item.plannedEndAt).getTime() >= Date.now())\n    .sort((a, b) => new Date(a.plannedStartAt).getTime() - new Date(b.plannedStartAt).getTime())[0] ?? null;',
              '  const nextScheduledAppointment = scheduledAppointments\n    .filter((item) => new Date(item.plannedEndAt).getTime() >= Date.now())\n    .sort((a, b) => new Date(a.plannedStartAt).getTime() - new Date(b.plannedStartAt).getTime())[0] ?? null;\n  const nextScheduledDiagnostic = nextScheduledAppointment\n    ? diagnostics.find((item) => normalizedPlate(item.vehicle.plateNumber) === normalizedPlate(nextScheduledAppointment.plate)) ?? null\n    : null;',
              'next scheduled diagnostic',
          )

          replace(
              '  function openTask(task: MechanicTask) {\n    setSelectedTaskId(task.id);\n    setScreen("WORK_DETAIL");\n    setError("");\n    setMessage("");\n  }',
              '  function openTask(task: MechanicTask) {\n    setSelectedTaskId(task.id);\n    setScreen("WORK_DETAIL");\n    setError("");\n    setMessage("");\n  }\n\n  function openDiagnostic(diagnosticId: string) {\n    setSelectedDiagnosticId(diagnosticId);\n    setScreen("DIAGNOSTIC_DETAIL");\n    setError("");\n    setMessage("");\n  }',
              'open diagnostic function',
          )

          notification_effect = '''  useEffect(() => {\n    const timer = window.setInterval(() => void loadNotifications().catch(() => undefined), 15000);\n    const refresh = () => void loadNotifications().catch(() => undefined);\n    window.addEventListener("focus", refresh);\n    return () => {\n      window.clearInterval(timer);\n      window.removeEventListener("focus", refresh);\n    };\n  }, [loadNotifications]);'''
          replacement_effect = notification_effect + '''\n\n  useEffect(() => {\n    const onOpenDiagnostic = (event: Event) => {\n      const diagnosticId = (event as CustomEvent<{ diagnosticId?: string }>).detail?.diagnosticId;\n      if (diagnosticId) openDiagnostic(diagnosticId);\n    };\n    const onOpenTask = (event: Event) => {\n      const taskId = (event as CustomEvent<{ taskId?: string }>).detail?.taskId;\n      const task = taskId ? tasks.find((item) => item.id === taskId) : null;\n      if (task) openTask(task);\n      else { setWorksFilter("ALL"); setScreen("WORKS"); }\n    };\n    const onRefresh = () => { void Promise.all([loadHome(), loadTasks(), loadDiagnostics()]).catch(() => undefined); };\n    window.addEventListener("turbolev:mechanic-open-diagnostic", onOpenDiagnostic);\n    window.addEventListener("turbolev:mechanic-open-task", onOpenTask);\n    window.addEventListener("turbolev:mechanic-refresh", onRefresh);\n    return () => {\n      window.removeEventListener("turbolev:mechanic-open-diagnostic", onOpenDiagnostic);\n      window.removeEventListener("turbolev:mechanic-open-task", onOpenTask);\n      window.removeEventListener("turbolev:mechanic-refresh", onRefresh);\n    };\n  }, [loadDiagnostics, loadHome, loadTasks, tasks]);'''
          replace(notification_effect, replacement_effect, 'scanner event integration')

          replace(
              '<p className={styles.subtle}>Замовлення-наряд та операції з’являться після оформлення автомобіля.</p><button type="button" className={styles.primary} onClick={() => openSchedule("ALL", "HOME")}>Відкрити графік →</button>',
              '<p className={styles.subtle}>{nextScheduledDiagnostic ? (["SUBMITTED", "CONFIRMED"].includes(nextScheduledDiagnostic.workflowState) ? "Діагностика завершена або передана. CRM очікує наступний етап." : "Діагностика доступна — можна переходити безпосередньо до автомобіля.") : "Діагностика ще не оформлена. Перевірте розділ діагностики."}</p><button type="button" className={styles.primary} onClick={() => nextScheduledDiagnostic ? openDiagnostic(nextScheduledDiagnostic.id) : setScreen("DIAGNOSTICS")}>{nextScheduledDiagnostic ? (nextScheduledDiagnostic.workflowState === "PENDING" ? "Почати діагностику →" : nextScheduledDiagnostic.workflowState === "IN_PROGRESS" || nextScheduledDiagnostic.workflowState === "RETURNED" ? "Продовжити діагностику →" : "Переглянути діагностику →") : "До діагностики →"}</button>',
              'next work smart action',
          )

          replace(
              'diagnostics.map((item) => <article className={styles.listCard} key={item.id}>',
              'diagnostics.map((item) => <button type="button" className={styles.listCard} key={item.id} onClick={() => openDiagnostic(item.id)}>',
              'diagnostic list open tag',
          )
          replace(
              '</span></article>)}</div>{!diagnostics.length',
              '</span></button>)}</div>{!diagnostics.length',
              'diagnostic list close tag',
          )

          replace(
              '      {screen === "NOTIFICATIONS" && <>',
              '      {screen === "DIAGNOSTIC_DETAIL" && selectedDiagnosticId && <MechanicDiagnosticWorkspace diagnosticId={selectedDiagnosticId} onBack={() => { setSelectedDiagnosticId(null); setScreen("DIAGNOSTICS"); }} onChanged={() => { void Promise.all([loadDiagnostics(), loadHome(), loadTasks()]).catch(() => undefined); }} />}\n\n      {screen === "NOTIFICATIONS" && <>',
              'diagnostic detail screen',
          )

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit integration
        shell: bash
        run: |
          rm -f .github/workflows/_apply-mechanic-smart-action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mechanic-standalone-cabinet.tsx .github/workflows/_apply-mechanic-smart-action.yml
          git commit -m "feat: wire mechanic smart action and diagnostic workspace"
          git push origin HEAD:fix/mechanic-smart-action-scan
