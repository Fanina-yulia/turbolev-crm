name: Extend Economics Status

on:
  push:
    branches: [agent/employee-performance-core-v1]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend Prisma economics status
        shell: python
        run: |
          from pathlib import Path
          path = Path('prisma/employee-performance.prisma')
          text = path.read_text()
          old = '''enum EconomicsStatus {
            INSUFFICIENT_DATA
            BELOW_BREAK_EVEN
            BREAK_EVEN
            PROFITABLE
            CAPACITY_CONSTRAINED
          }
          '''
          new = '''enum EconomicsStatus {
            INSUFFICIENT_DATA
            BELOW_BREAK_EVEN
            BREAK_EVEN
            PROFITABLE
            CAPACITY_CONSTRAINED
            EFFECTIVE
            UNDERUTILIZED
            NEEDS_ATTENTION
          }
          '''
          if old not in text:
              if 'NEEDS_ATTENTION' in text:
                  raise SystemExit(0)
              raise SystemExit('EconomicsStatus anchor not found')
          path.write_text(text.replace(old, new))
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/extend-economics-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/employee-performance.prisma .github/workflows/extend-economics-status.yml
          git commit -m "Extend economics statuses for role evaluation"
          git push
