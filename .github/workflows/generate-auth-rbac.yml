name: Generate Auth RBAC Assets

on:
  push:
    branches: [agent/auth-rbac-v1]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_auth_gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_auth_gen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_auth_gen
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_auth_gen

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-rbac-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate security schema
        run: npx prisma validate

      - name: Generate Prisma migration non-interactively
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_DIR='prisma/migrations/20260815074500_auth_rbac_v1'
          if test -f "$MIGRATION_DIR/migration.sql"; then
            echo 'Migration already exists.'
            exit 0
          fi
          npx prisma migrate deploy
          mkdir -p "$MIGRATION_DIR"
          npx prisma migrate diff --from-config-datasource --to-schema prisma --script > "$MIGRATION_DIR/migration.sql"
          test -s "$MIGRATION_DIR/migration.sql"
          printf '\n' >> "$MIGRATION_DIR/migration.sql"
          cat scripts/auth-rbac-seed.sql >> "$MIGRATION_DIR/migration.sql"

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/migrations/20260815074500_auth_rbac_v1/migration.sql
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Generate auth RBAC migration'
          git push origin HEAD:agent/auth-rbac-v1
