name: Generate Auth RBAC Assets

on:
  push:
    branches: [agent/auth-rbac-v1]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_auth_gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_auth_gen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_auth_gen
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_auth_gen

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-rbac-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Add current Neon Auth SDK
        run: npm install @neondatabase/auth@latest --save --no-audit --no-fund

      - name: Validate security schema
        run: npx prisma validate

      - name: Create Prisma migration
        shell: bash
        run: |
          set -euo pipefail
          if find prisma/migrations -maxdepth 1 -type d -name '*_auth_rbac_v1' | grep -q .; then
            echo 'Migration already exists.'
            exit 0
          fi
          npx prisma migrate dev --name auth_rbac_v1 --create-only
          MIGRATION_DIR="$(find prisma/migrations -maxdepth 1 -type d -name '*_auth_rbac_v1' | sort | tail -1)"
          test -n "$MIGRATION_DIR"
          printf '\n' >> "$MIGRATION_DIR/migration.sql"
          cat scripts/auth-rbac-seed.sql >> "$MIGRATION_DIR/migration.sql"

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json prisma/migrations
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Generate auth RBAC migration and Neon Auth lockfile'
          git push origin HEAD:agent/auth-rbac-v1
