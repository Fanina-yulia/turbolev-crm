name: Sync NHTSA vPIC Local Database

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 20 * *"

permissions:
  contents: read

concurrency:
  group: vpic-local-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is missing"
            exit 1
          fi

      - name: Discover and download latest PostgreSQL vPIC backup
        shell: python
        run: |
          import html
          import re
          import urllib.parse
          import urllib.request
          import zipfile

          page_url = "https://vpic.nhtsa.dot.gov/downloads/"
          request = urllib.request.Request(page_url, headers={"User-Agent": "TurboLEV-CRM/2.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              page = response.read().decode("utf-8", errors="replace")

          matches = re.findall(r'href=["\']([^"\']*vPICList_lite_[0-9_]+\.custom\.zip)["\']', page, re.I)
          if not matches:
              raise SystemExit("Could not discover current vPIC PostgreSQL custom backup")

          backup_url = urllib.parse.urljoin(page_url, html.unescape(matches[0]))
          print(f"Downloading {backup_url}")
          request = urllib.request.Request(backup_url, headers={"User-Agent": "TurboLEV-CRM/2.0"})
          with urllib.request.urlopen(request, timeout=180) as response, open("vpic.custom.zip", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)

          with zipfile.ZipFile("vpic.custom.zip") as archive:
              candidates = [item for item in archive.infolist() if not item.is_dir()]
              if not candidates:
                  raise SystemExit("Downloaded vPIC ZIP is empty")
              member = max(candidates, key=lambda item: item.file_size)
              with archive.open(member) as source, open("vpic.custom", "wb") as target:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      target.write(chunk)
          print(f"Prepared {member.filename} ({member.file_size:,} bytes)")

      - name: Restore only the vpic schema
        shell: bash
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18 \
            sh -lc 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS vpic CASCADE;"'

          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD:/work:ro" \
            postgres:18 \
            sh -lc 'pg_restore --dbname="$DATABASE_URL" --no-owner --no-privileges --exit-on-error /work/vpic.custom'

      - name: Verify local decoder
        shell: bash
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:18 \
            sh -lc 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS decoder_functions FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname=''vpic'' AND lower(p.proname)=''spvindecode'';" -c "SELECT * FROM vpic.spVinDecode(''1HGCM82633A004352'') LIMIT 5;"'

      - name: Cleanup archive
        if: always()
        run: rm -f vpic.custom.zip vpic.custom
