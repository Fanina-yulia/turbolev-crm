name: P0 Schema Audit

on:
  push:
    branches: [agent/p0-schema-baseline]

permissions:
  contents: read

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_schema_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_schema_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate current-schema baseline SQL
        run: npx prisma migrate diff --from-empty --to-schema prisma --script > baseline.sql
      - name: Test existing migration history from empty database
        run: npx prisma migrate deploy
      - name: Compare migrated database with Prisma schema
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma
      - name: Export tested Prisma migration ledger
        shell: bash
        run: |
          cat > migration-ledger.sql <<'SQL'
          CREATE TABLE IF NOT EXISTS "_prisma_migrations" (
            "id" VARCHAR(36) NOT NULL,
            "checksum" VARCHAR(64) NOT NULL,
            "finished_at" TIMESTAMPTZ,
            "migration_name" VARCHAR(255) NOT NULL,
            "logs" TEXT,
            "rolled_back_at" TIMESTAMPTZ,
            "started_at" TIMESTAMPTZ NOT NULL DEFAULT now(),
            "applied_steps_count" INTEGER NOT NULL DEFAULT 0,
            CONSTRAINT "_prisma_migrations_pkey" PRIMARY KEY ("id")
          );
          SQL
          psql "$DATABASE_URL" -Atc "SELECT format('INSERT INTO \"_prisma_migrations\" (\"id\",\"checksum\",\"finished_at\",\"migration_name\",\"logs\",\"rolled_back_at\",\"started_at\",\"applied_steps_count\") VALUES (%L,%L,%L,%L,%L,%L,%L,%s) ON CONFLICT (\"id\") DO NOTHING;', id, checksum, finished_at, migration_name, logs, rolled_back_at, started_at, applied_steps_count) FROM \"_prisma_migrations\" ORDER BY started_at;" >> migration-ledger.sql
      - uses: actions/upload-artifact@v4
        with:
          name: p0-schema-audit
          path: |
            baseline.sql
            migration-ledger.sql
          if-no-files-found: error
