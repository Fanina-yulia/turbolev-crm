name: One-off personnel role delegation fix

on:
  push:
    branches:
      - agent/personnel-role-delegation-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/personnel-role-delegation-fix
          fetch-depth: 0
      - name: Apply personnel role delegation fix
        run: python3 scripts/one-off-personnel-role-delegation.py
      - name: Validate patch
        run: |
          git diff --check
          git status --short
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/services/personnel-access.service.ts scripts/one-off-personnel-role-delegation.py .github/workflows/one-off-personnel-role-delegation.yml
          git commit -m "Allow assigning service advisor and shift master roles"
          git push origin HEAD:agent/personnel-role-delegation-fix
