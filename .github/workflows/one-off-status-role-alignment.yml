name: One-off status role alignment

on:
  push:
    branches:
      - agent/status-role-alignment-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-role-alignment-v2
          fetch-depth: 0
      - name: Apply focused status and role alignment
        run: python3 scripts/one-off-status-role-alignment.py
      - name: Verify patch shape
        run: |
          git diff --check
          git status --short
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/domain/workflow/types.ts \
            src/domain/workflow/catalog.ts \
            src/domain/workflow/registry.ts \
            src/services/planner.service.ts \
            src/services/work-orders.service.ts \
            app/api/qc/route.ts \
            app/qc-queue.tsx \
            app/api/work-orders/[id]/payments/route.ts \
            src/security/access-matrix-catalog.ts \
            app/role-cabinet.tsx \
            prisma/migrations/20260820031000_status_role_alignment/migration.sql \
            docs/ROLE_STATUS_MATRIX.md \
            scripts/one-off-status-role-alignment.py \
            .github/workflows/one-off-status-role-alignment.yml
          git commit -m "Align service statuses and operational roles"
          git push origin HEAD:agent/status-role-alignment-v2
