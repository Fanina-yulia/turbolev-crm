name: Employee Performance Migration Diff

on:
  push:
    branches: [agent/employee-performance-core-v1]

permissions:
  contents: write

concurrency:
  group: employee-performance-migration-diff
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_employee_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_employee_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_employee_core
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_employee_core
      MIGRATION_PATH: prisma/migrations/20260815060000_employee_performance_core/migration.sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply current migration history
        run: npx prisma migrate deploy
      - name: Generate production-compatible migration when missing
        shell: bash
        run: |
          if [ ! -f "$MIGRATION_PATH" ]; then
            npx prisma migrate diff --from-config-datasource --to-schema prisma --script > employee-performance-raw.sql
            python3 scripts/generate-employee-performance-migration.py employee-performance-raw.sql "$MIGRATION_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$MIGRATION_PATH"
            git commit -m "Add employee performance core migration"
            git push
          fi
      - name: Apply employee performance migration
        run: npx prisma migrate deploy
      - name: Reject Prisma / migration drift
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma
      - name: Test employee economics invariants
        run: npx --no-install tsx scripts/employee-economics-smoke.ts
      - name: Production build
        run: npm run build
