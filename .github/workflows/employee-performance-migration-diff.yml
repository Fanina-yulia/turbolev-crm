name: Employee Performance Migration Diff

on:
  push:
    branches: [agent/employee-performance-core-v1]

permissions:
  contents: read

concurrency:
  group: employee-performance-migration-diff
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_employee_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_employee_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_employee_core
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_employee_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply current migration history
        run: npx prisma migrate deploy
      - name: Generate exact migration SQL
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma --script > employee-performance-migration.sql
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: employee-performance-migration
          path: employee-performance-migration.sql
          if-no-files-found: error
