name: Integration API Request Guards

on:
  pull_request:
    paths:
      - "src/security/service-access-context.ts"
      - "src/security/integration-api-request-guard.ts"
      - "src/lib/contracts/integration/v1/**"
      - "scripts/integration-api-request-guards-smoke.ts"
      - "prisma/integration-api.prisma"
      - "prisma/migrations/*integration_api_request_guards/**"
      - ".github/workflows/integration-api-request-guards.yml"
  push:
    branches: [main]
    paths:
      - "src/security/service-access-context.ts"
      - "src/security/integration-api-request-guard.ts"
      - "src/lib/contracts/integration/v1/**"
      - "scripts/integration-api-request-guards-smoke.ts"
      - "prisma/integration-api.prisma"
      - "prisma/migrations/*integration_api_request_guards/**"
      - ".github/workflows/integration-api-request-guards.yml"

permissions:
  contents: read

jobs:
  request-guards-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: TypeScript contract check
        run: npx tsc --noEmit
      - name: Apply full migration history to disposable PostgreSQL 18
        run: bash scripts/ci-migrate-with-external-fixtures.sh
      - name: Integration request guard smoke
        run: npx --no-install tsx scripts/integration-api-request-guards-smoke.ts
