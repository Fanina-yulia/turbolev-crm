name: Temporary management cabinets phase 1

on:
  push:
    branches: [feature/management-result-cabinets-v1]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, '[mgmt-cabinet-phase1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch role routing and cabinet presentation
        shell: python
        run: |
          from pathlib import Path

          # 1. Canonical role -> dedicated executive cabinet code.
          p = Path('src/security/role-contract.ts')
          s = p.read_text()
          s = s.replace('  | "OWNER"\n  | "SERVICE_ADVISOR"', '  | "OWNER"\n  | "EXECUTIVE"\n  | "SERVICE_ADVISOR"')
          s = s.replace('  EXECUTIVE_DIRECTOR: "OWNER",', '  EXECUTIVE_DIRECTOR: "EXECUTIVE",')
          old = '  if (normalized.some((role) => ROLE_CABINET_BY_CODE[role.code] === "OWNER")) return "OWNER";\n\n  const primary = normalized.find((role) => role.isPrimary);'
          new = '  if (normalized.some((role) => ROLE_CABINET_BY_CODE[role.code] === "OWNER")) return "OWNER";\n  if (normalized.some((role) => ROLE_CABINET_BY_CODE[role.code] === "EXECUTIVE")) return "EXECUTIVE";\n\n  const primary = normalized.find((role) => role.isPrimary);'
          if old not in s: raise SystemExit('role-contract resolve anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2. Route EXECUTIVE_DIRECTOR to same analytic core in explicit executive mode.
          p = Path('app/role-cabinet.tsx')
          s = p.read_text()
          old = '  const ownerRole = resolvedCabinet === "OWNER";\n  const serviceAdvisorRole = resolvedCabinet === "SERVICE_ADVISOR";'
          new = '  const ownerRole = resolvedCabinet === "OWNER";\n  const executiveRole = resolvedCabinet === "EXECUTIVE";\n  const serviceAdvisorRole = resolvedCabinet === "SERVICE_ADVISOR";'
          if old not in s: raise SystemExit('role-cabinet role anchor not found')
          s = s.replace(old, new, 1)
          old = '  if (ownerRole && access?.provisioningState === "ACTIVE") return withRoleQueues(<OwnerControlCenter userName={access?.user?.name} />);\n  if (serviceAdvisorRole'
          new = '  if (ownerRole && access?.provisioningState === "ACTIVE") return withRoleQueues(<OwnerControlCenter mode="OWNER" userName={access?.user?.name} />);\n  if (executiveRole && access?.provisioningState === "ACTIVE") return withRoleQueues(<OwnerControlCenter mode="EXECUTIVE" userName={access?.user?.name} />);\n  if (serviceAdvisorRole'
          if old not in s: raise SystemExit('role-cabinet render anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3. Make shared dashboard explicitly role-aware without duplicating formulas.
          p = Path('app/owner-dashboard.tsx')
          s = p.read_text()
          old = 'export function OwnerControlCenter({ userName }: { userName?: string | null }) {'
          new = 'export function OwnerControlCenter({ userName, mode = "OWNER" }: { userName?: string | null; mode?: "OWNER" | "EXECUTIVE" }) {\n  const isExecutive = mode === "EXECUTIVE";'
          if old not in s: raise SystemExit('owner signature anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('cause instanceof Error ? cause.message : "Помилка кабінету власника"', 'cause instanceof Error ? cause.message : isExecutive ? "Помилка кабінету виконавчого директора" : "Помилка кабінету власника"', 1)
          s = s.replace('<p className="eyebrow">TURBO LEV · OWNER CONTROL CENTER</p>\n        <h1>Пульт власника</h1>\n        <span className="muted">{userName || "Власник"}', '<p className="eyebrow">{isExecutive ? "TURBO LEV · EXECUTIVE CONTROL CENTER" : "TURBO LEV · OWNER CONTROL CENTER"}</p>\n        <h1>{isExecutive ? "Пульт виконавчого директора" : "Пульт власника"}</h1>\n        <span className="muted">{userName || (isExecutive ? "Виконавчий директор" : "Власник")}', 1)
          s = s.replace('<strong>Не вдалося оновити пульт власника</strong>', '<strong>{isExecutive ? "Не вдалося оновити пульт виконавчого директора" : "Не вдалося оновити пульт власника"}</strong>', 1)
          s = s.replace('>Моє рішення <b>{ownerAttention.length}</b></button>\n          <button type="button" role="tab" aria-selected={attentionTab === "TEAM"}', '>{isExecutive ? "Ескалації мені" : "Моє рішення"} <b>{ownerAttention.length}</b></button>\n          <button type="button" role="tab" aria-selected={attentionTab === "TEAM"}', 1)
          s = s.replace('>Контроль команди <b>{teamAttention.length}</b></button>', '>{isExecutive ? "Контроль керівників" : "Контроль команди"} <b>{teamAttention.length}</b></button>', 1)
          p.write_text(s)

          # 4. Contract smoke.
          p = Path('scripts/role-cabinet-contract-smoke.ts')
          s = p.read_text()
          anchor = 'assert.equal(resolveRoleCabinet([{ code: "OWNER", isPrimary: true }, { code: "MECHANIC" }]), "OWNER");\n'
          if anchor not in s: raise SystemExit('smoke anchor not found')
          s = s.replace(anchor, anchor + 'assert.equal(resolveRoleCabinet([{ code: "EXECUTIVE_DIRECTOR", isPrimary: true }]), "EXECUTIVE");\n', 1)
          p.write_text(s)

      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run role contract smoke
        run: node --import tsx scripts/role-cabinet-contract-smoke.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit tested phase 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Turbo LEV Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/management-cabinets-phase1-temp.yml
          git add src/security/role-contract.ts app/role-cabinet.tsx app/owner-dashboard.tsx scripts/role-cabinet-contract-smoke.ts
          git commit -m "feat(cabinets): separate executive director control center"
          git push origin HEAD:feature/management-result-cabinets-v1
