name: Import MVS Vehicle Registry

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated years; blank means recovery set"
        required: false
        default: "2026,2022,2019,2018,2017"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mvs-import.yml"
      - "scripts/import-mvs-open-data.py"
  schedule:
    - cron: "17 3 2 * *"

permissions:
  contents: read

concurrency:
  group: mvs-vehicle-registry-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve import years
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_YEARS: ${{ github.event.inputs.years }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            YEARS="2026"
          elif [ -n "$REQUESTED_YEARS" ]; then
            YEARS="$REQUESTED_YEARS"
          else
            YEARS="2026,2022,2019,2018,2017"
          fi
          echo "MVS_IMPORT_YEARS=$YEARS" >> "$GITHUB_ENV"
          echo "Will import MVS years: $YEARS"

      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Verify database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is missing"
            exit 1
          fi

      - name: Import compact MVS vehicle registry
        run: python scripts/import-mvs-open-data.py
