name: Temporary Binotel recording export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/binotel-export-temp.yml"

permissions:
  contents: read

env:
  EXPORT_URL: https://turbolev-crm.vercel.app/internal-binotel-download

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download answered call recordings in private batches
        shell: bash
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p export
          for offset in $(seq 0 5 60); do
            part="/tmp/binotel-${offset}.zip"
            ok=0
            for attempt in $(seq 1 30); do
              code=$(curl --location --silent --show-error \
                --output "$part" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${GH_REPO_TOKEN}" \
                "${EXPORT_URL}?offset=${offset}&limit=5" || true)
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              echo "offset=${offset} attempt=${attempt} http=${code}; retrying..."
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Failed to export offset ${offset}" >&2
              exit 1
            fi
            unzip -q -o "$part" -d export
            if [ -f export/manifest.json ]; then
              mv export/manifest.json "export/manifest-${offset}.json"
            fi
          done

          count=$(find export -maxdepth 1 -type f -name '*.mp3' | wc -l | tr -d ' ')
          echo "Downloaded MP3 recordings: ${count}"
          if [ "$count" -lt 61 ]; then
            echo "Expected 61 answered recordings, got ${count}" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json, glob
          items=[]
          for path in sorted(glob.glob('export/manifest-*.json')):
              with open(path, encoding='utf-8') as f:
                  data=json.load(f)
              items.extend(data.get('items', []))
          with open('export/manifest-all.json','w',encoding='utf-8') as f:
              json.dump({'total':len(items),'items':items},f,ensure_ascii=False,indent=2,default=str)
          PY

          zip -0 -q -r Turbo_LEV_Binotel_calls_last_14_days.zip export

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turbo_LEV_Binotel_calls_last_14_days
          path: Turbo_LEV_Binotel_calls_last_14_days.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
