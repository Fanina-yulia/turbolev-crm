name: One-off complete operational role catalog

on:
  push:
    branches:
      - agent/personnel-role-delegation-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/personnel-role-delegation-fix
          fetch-depth: 0
      - name: Apply role catalog completion
        run: python3 scripts/one-off-complete-role-catalog.py
      - name: Validate patch
        run: |
          git diff --check
          git status --short
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/services/personnel-access.service.ts \
            src/security/access-matrix-catalog.ts \
            prisma/migrations/20260820031500_complete_operational_role_catalog/migration.sql \
            scripts/one-off-complete-role-catalog.py \
            .github/workflows/one-off-complete-role-catalog.yml
          git commit -m "Complete operational role catalog"
          git push origin HEAD:agent/personnel-role-delegation-fix
