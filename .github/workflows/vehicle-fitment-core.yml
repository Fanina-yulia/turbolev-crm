name: Vehicle Fitment Core

on:
  pull_request:
    paths:
      - "prisma/vehicle-resolution.prisma"
      - "prisma/vehicle-fitment.prisma"
      - "prisma/migrations/20260823011500_vehicle_resolution_core/**"
      - "prisma/migrations/20260823014000_vehicle_fitment_core/**"
      - "scripts/vehicle-resolution-core-smoke.ts"
      - "scripts/vehicle-fitment-core-smoke.ts"
      - "scripts/ci-normalize-prisma-drift.sql"
      - ".github/workflows/vehicle-resolution-core.yml"
      - ".github/workflows/vehicle-fitment-core.yml"
  push:
    branches: [main]
    paths:
      - "prisma/vehicle-resolution.prisma"
      - "prisma/vehicle-fitment.prisma"
      - "prisma/migrations/20260823011500_vehicle_resolution_core/**"
      - "prisma/migrations/20260823014000_vehicle_fitment_core/**"
      - "scripts/vehicle-resolution-core-smoke.ts"
      - "scripts/vehicle-fitment-core-smoke.ts"
      - "scripts/ci-normalize-prisma-drift.sql"
      - ".github/workflows/vehicle-resolution-core.yml"
      - ".github/workflows/vehicle-fitment-core.yml"

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Apply full migration history to disposable PostgreSQL 18
        run: bash scripts/ci-migrate-with-external-fixtures.sh
      - name: Vehicle resolution Phase A smoke
        run: npx --no-install tsx scripts/vehicle-resolution-core-smoke.ts
      - name: Vehicle fitment Phase B smoke
        run: npx --no-install tsx scripts/vehicle-fitment-core-smoke.ts
