name: One-off finalize status role alignment

on:
  push:
    branches:
      - agent/status-role-alignment-current

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-role-alignment-current
          fetch-depth: 0
      - name: Apply final operating policy fixes
        run: python3 scripts/one-off-status-role-finalize.py
      - name: Validate patch
        run: |
          git diff --check
          git status --short
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/security/operating-role-policy.ts \
            prisma/migrations/20260820024500_status_role_alignment/migration.sql \
            app/api/qc/route.ts \
            app/qc-queue.tsx \
            app/role-cabinet.tsx \
            docs/ROLE_STATUS_MATRIX.md \
            scripts/one-off-status-role-finalize.py \
            .github/workflows/one-off-status-role-finalize.yml
          git commit -m "Finalize service role ownership and payment flow"
          git push origin HEAD:agent/status-role-alignment-current
