name: Parts Cascade UI V2 Patch

on:
  push:
    branches:
      - feature/parts-cascade-ui-persistence-v2
    paths:
      - scripts/apply-parts-cascade-ui-v2.mjs
      - .github/workflows/parts-cascade-ui-v2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/parts-cascade-ui-persistence-v2
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/apply-parts-cascade-ui-v2.mjs

      - name: Commit patched UI when changed
        shell: bash
        run: |
          if git diff --quiet -- app/parts-catalog-legacy.tsx; then
            echo "UI patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/parts-catalog-legacy.tsx
          git commit -m "feat(parts): expose assembly alternatives and unblock cascade search"
          git push origin HEAD:feature/parts-cascade-ui-persistence-v2
