name: CRM Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
      modules: ${{ steps.scope.outputs.modules }}
      dependency_modules: ${{ steps.scope.outputs.dependency_modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve CI scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "modules=main-push" >> "$GITHUB_OUTPUT"
            echo "dependency_modules=" >> "$GITHUB_OUTPUT"
            echo "# Module-aware CI plan" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Push to main: full production safety gate is mandatory." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/module-ci.mjs --base "origin/${{ github.base_ref }}"
          fi

  module-checks:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Run targeted stateless module smoke checks
        run: node scripts/module-ci.mjs --base "origin/${{ github.base_ref }}" --run

  build:
    needs: scope
    if: github.event_name == 'push' || needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbolev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbolev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbolev_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/turbolev_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # @neondatabase/auth is pinned; its current peer metadata requires Next 16
        # even though the adapter builds against our Next 15 app. .npmrc enables
        # the compatibility bridge until Turbo LEV moves the full app to Next 16.
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply full migration history on clean PostgreSQL 18
        # VehicleRegistryCompact is populated outside Prisma in production. The
        # helper attaches an empty CI-only fixture after Prisma initializes its
        # migration metadata, preserving a true clean-database replay.
        run: bash scripts/ci-migrate-with-external-fixtures.sh

      - name: Normalize SQL-managed objects for Prisma drift check
        # This mutates only the disposable CI database. Production keeps its MVS
        # registry, SQL-managed image library and database-level integrity guards.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-normalize-prisma-drift.sql

      - name: Reject Prisma / migration schema drift
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma

      - name: Canonical CRM contracts smoke test
        run: npm run contracts:smoke

      - name: Diagnostic workflow smoke test
        run: npx --no-install tsx scripts/diagnostic-flow-smoke.ts

      - name: Vehicle pricing classifier smoke test
        run: npx --no-install tsx scripts/vehicle-classifier-smoke.ts

      - name: Vehicle image resolver smoke test
        run: npx --no-install tsx scripts/vehicle-image-resolver-smoke.ts

      - name: Vehicle generation catalog smoke test
        run: npx --no-install tsx scripts/vehicle-generation-catalog-smoke.ts

      - name: Employee economics attribution smoke test
        run: npx --no-install tsx scripts/employee-economics-smoke.ts

      - name: Telephony webhook smoke test
        run: npx --no-install tsx scripts/production-telephony-smoke.ts

      - name: Binotel provider contract smoke test
        run: npx --no-install tsx scripts/binotel-webhook-contract-smoke.ts

      - name: RBAC security smoke test
        run: npx --no-install tsx scripts/rbac-smoke.ts

      - name: API security policy coverage
        run: npx --no-install tsx scripts/api-security-policy-smoke.ts

      - name: Communications contact inbox smoke test
        run: npx --no-install tsx scripts/communications-inbox-smoke.ts

      - name: Communication image attachment smoke test
        run: npx --no-install tsx scripts/communication-attachments-smoke.ts

      - name: Communication inbound media view smoke test
        run: npx --no-install tsx scripts/communication-message-view-smoke.ts

      - name: Communication activation diagnostics smoke test
        run: npx --no-install tsx scripts/communication-activation-diagnostics-smoke.ts

      - name: Production build
        run: npm run build
