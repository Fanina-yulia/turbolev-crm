name: Mechanic Process Card Integrity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mechanic-process-card-integrity.yml"
      - "scripts/mechanic-process-integrity.sql"

permissions:
  contents: read

concurrency:
  group: mechanic-process-card-integrity
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is missing"
            exit 1
          fi

      - name: Audit and repair canonical diagnostic/repair purpose
        shell: bash
        run: |
          docker run --rm \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "$PWD:/work:ro" \
            postgres:18 \
            sh -lc 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /work/scripts/mechanic-process-integrity.sql'
